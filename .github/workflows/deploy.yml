name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          # Keep the Terraform public IP in the workflow until DEPLOY_HOST
          # secret is updated (GitHub sudo/2FA is required to change secrets).
          HOST="16.171.21.55"

          if [ -z "${HOST}" ]; then
            echo "DEPLOY_HOST secret is empty"
            exit 1
          fi
          if [ -z "${USER_NAME}" ]; then
            echo "DEPLOY_USER secret is empty"
            exit 1
          fi
          if [ -z "${SSH_KEY}" ]; then
            echo "DEPLOY_SSH_KEY secret is empty"
            exit 1
          fi

          echo "Deploying to ${USER_NAME}@${HOST}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts || true

          echo "Connecting to ${USER_NAME}@${HOST} ..."
          ssh ${SSH_OPTS} "${USER_NAME}@${HOST}" \
            "sudo mkdir -p /opt/items-crud && sudo chown ${USER_NAME}:${USER_NAME} /opt/items-crud"

          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude 'dist' \
            --exclude '.deploy' \
            --exclude '.env' \
            -e "ssh ${SSH_OPTS}" \
            ./ "${USER_NAME}@${HOST}:/opt/items-crud/"

          ssh ${SSH_OPTS} "${USER_NAME}@${HOST}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/items-crud
          if [ ! -f .env ] || ! grep -qE '^JWT_SECRET=.+' .env; then
            echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
            echo "Generated new JWT_SECRET in .env"
          fi
          sudo systemctl stop nginx || true
          sudo systemctl disable nginx || true
          sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
          sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          sleep 2
          curl -fsS http://127.0.0.1/api/health
          echo
          echo "Deploy OK"
          EOF
