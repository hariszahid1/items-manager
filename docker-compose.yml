services:
  backend:
    build: ./backend
    container_name: items-backend
    ports:
      - "4000:4000"
    volumes:
      - items_data:/data
    environment:
      PORT: 4000
      DATA_DIR: /data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: items-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  items_data:
